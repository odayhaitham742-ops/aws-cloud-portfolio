name: Deploy portfolio to AWS

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: portfolio-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync site to private S3 and invalidate CloudFront
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate website files and local links
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path(".")
          html = (root / "index.html").read_text(encoding="utf-8")
          class PageCheck(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id"):
                      self.ids.add(attrs["id"])
                  for attr in ("src", "href"):
                      value = attrs.get(attr, "")
                      if value:
                          self.refs.append(value)

          page = PageCheck()
          page.feed(html)
          missing = []
          bad_fragments = []
          for ref in page.refs:
              parsed = urlparse(ref)
              if parsed.scheme or parsed.netloc or ref.startswith(("data:", "mailto:", "tel:", "javascript:")):
                  continue
              if parsed.path:
                  target = (root / parsed.path.lstrip("/")).resolve()
                  if not target.is_file():
                      missing.append(ref)
              if parsed.fragment and not parsed.path and parsed.fragment not in page.ids:
                  bad_fragments.append(ref)
          if missing or bad_fragments:
              if missing:
                  print("Missing local files:", *missing, sep="\\n- ")
              if bad_fragments:
                  print("Missing in-page anchors:", *bad_fragments, sep="\\n- ")
              raise SystemExit(1)
          for required in ("assets/css/style.css", "assets/js/script.js", "assets/images/oday-profile.jpg"):
              if not (root / required).is_file():
                  raise SystemExit(f"Required asset missing: {required}")
          print(f"HTML parsed; {len(page.refs)} local/external references checked; required assets exist.")
          PY

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$AWS_REGION" || (echo "Missing repository variable AWS_REGION" && exit 1)
          test -n "$S3_BUCKET" || (echo "Missing repository variable S3_BUCKET" && exit 1)
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || (echo "Missing repository variable CLOUDFRONT_DISTRIBUTION_ID" && exit 1)

      - name: Upload website files to S3
        shell: bash
        run: |
          aws s3 cp index.html "s3://$S3_BUCKET/index.html" --content-type "text/html; charset=utf-8"
          aws s3 sync assets/ "s3://$S3_BUCKET/assets/" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
